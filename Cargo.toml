[workspace]
resolver = "2"
members = [
    "common",
    "mongo-wrapper",
    "haproxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "signal", "net"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
nix = { version = "0.29", features = ["signal", "process", "fs", "user"] }
axum = "0.8"
# The official MongoDB Rust driver. rustls (no OpenSSL) so the static musl
# build in the Dockerfile stays self-contained; the dns-resolver feature is
# off because every connection the wrapper makes is to a literal host:port
# (localhost, or a peer's private domain) — never a `mongodb+srv://` URI.
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
